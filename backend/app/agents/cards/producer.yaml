{
  "name": "producer",
  "description": "理解文本与附件，简单任务直接规划，按需委派复杂任务；唯一对外提问并提交审核的角色。",
  "accepts": {
    "request": "UserRequest"
  },
  "returns": "ProducerOutput",
  "model_role": "producer",
  "tools": [
    "list_skills",
    "load_skill",
    "read_skill_resource",
    "list_agents",
    "read_workspace",
    "write_workspace",
    "ask_user",
    "finish",
    "delegate",
    "analyze_images",
    "analyze_video",
    "get_task_status",
    "list_models",
    "list_templates",
    "estimate_cost",
    "check_plan",
    "append_plan_nodes",
    "instantiate_blueprint",
    "submit_plan",
    "request_preview"
  ],
  "can_delegate_to": [
    "research",
    "creative",
    "director",
    "critic",
    "repair"
  ],
  "limits": {
    "max_steps": 40,
    "max_llm_calls": 30,
    "planning_credits": 20,
    "max_parallel_delegations": 4
  },
  "prompt": "prompts/producer.md"
}
