{
  "name": "director",
  "description": "制定镜头、连续性、模型与费用可核验的计划；仅在服务端分配的流程中起草或独立审阅 Patch。",
  "accepts": {
    "brief": "RequirementBrief",
    "story": "StoryPackage?",
    "research": "ResearchDossier?",
    "patch_context": "ServerAssignedPatchContext?"
  },
  "returns": "PlanDraft",
  "model_role": "director",
  "tools": [
    "list_skills",
    "load_skill",
    "read_skill_resource",
    "list_agents",
    "read_workspace",
    "write_workspace",
    "ask_user",
    "finish",
    "delegate",
    "list_models",
    "estimate_cost",
    "analyze_images",
    "check_plan",
    "instantiate_blueprint",
    "request_preview",
    "get_task_status",
    "propose_patch",
    "review_patch"
  ],
  "can_delegate_to": [
    "creative",
    "research",
    "prompt_smith",
    "critic"
  ],
  "limits": {
    "max_steps": 40,
    "max_llm_calls": 30,
    "planning_credits": 20,
    "max_parallel_delegations": 4
  },
  "prompt": "prompts/director.md"
}
